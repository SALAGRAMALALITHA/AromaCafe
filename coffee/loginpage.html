<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aroma Cafe - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="c.js" defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-image: url('https://images.template.net/218246/coffee-brown-background-edit-online.jpg');
            background-size: cover; background-position: center; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Roboto', Arial, sans-serif;
        }
        .login-container { background: rgba(255,255,255,0.97); border-radius: 16px; box-shadow: 0 8px 32px rgba(42,21,3,0.3); overflow: hidden; width: 440px; max-width: 95vw; }
        .login-header { background: #2a1503; padding: 24px; text-align: center; }
        .login-header img { border-radius: 50%; border: 3px solid #f3961c; }
        .login-header h1 { color: #fff; font-size: 1.6rem; margin-top: 10px; letter-spacing: 1px; }

        .tabs { display: flex; border-bottom: 1px solid #eee; }
        .tab-btn {
            flex: 1; padding: 14px; text-align: center; background: none; border: none;
            font-size: 1rem; font-weight: 600; color: #999; cursor: pointer;
            border-bottom: 3px solid transparent; transition: 0.2s;
        }
        .tab-btn.active { color: #2a1503; border-bottom-color: #f3961c; }

        .login-form { padding: 28px 36px; display: none; }
        .login-form.active { display: block; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; color: #2a1503; font-weight: 500; margin-bottom: 6px; font-size: 0.92rem; }
        .input-group input { width: 100%; padding: 11px 14px; border: 1.5px solid #ccc; border-radius: 8px; font-size: 1rem; }
        .input-group input:focus { outline: none; border-color: #2a1503; }
        .error-msg { color: #cc0000; font-size: 0.85rem; margin-top: 4px; display: none; }
        .form-error { color: #cc0000; font-size: 0.9rem; margin-bottom: 12px; display: none; text-align: center; }

        button[type="submit"] {
            width: 100%; padding: 12px; background: #2a1503; color: #fff; border: none;
            border-radius: 8px; font-size: 1.05rem; font-weight: 600; cursor: pointer;
            transition: background 0.3s; margin-top: 6px;
        }
        button[type="submit"]:hover { background: #f3961c; color: #2a1503; }
        .switch-tab { text-align: center; margin-top: 16px; font-size: 0.9rem; color: #555; }
        .switch-tab a { color: #2a1503; font-weight: 600; text-decoration: underline; cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <img src="logo.jpg" alt="Aroma Cafe" width="80" height="80">
            <h1>Aroma Cafe</h1>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="signin">Sign In</button>
            <button class="tab-btn" data-tab="signup">Create Account</button>
        </div>

        <!-- ============== SIGN IN ============== -->
        <form class="login-form active" id="signinForm" data-form="signin">
            <div class="form-error" id="signinError"></div>
            <div class="input-group">
                <label for="si-email">Email Address</label>
                <input type="email" id="si-email" required>
            </div>
            <div class="input-group">
                <label for="si-password">Password</label>
                <input type="password" id="si-password" required>
            </div>
            <button type="submit">Sign In</button>
            <div class="switch-tab">New here? <a data-goto="signup">Create an account</a></div>
        </form>

        <!-- ============== CREATE ACCOUNT ============== -->
        <form class="login-form" id="signupForm" data-form="signup">
            <div class="form-error" id="signupError"></div>
            <div class="input-group">
                <label for="su-name">Full Name</label>
                <input type="text" id="su-name" required>
            </div>
            <div class="input-group">
                <label for="su-email">Email Address</label>
                <input type="email" id="su-email" required>
            </div>
            <div class="input-group">
                <label for="su-phone">Phone Number</label>
                <input type="tel" id="su-phone" placeholder="10-digit mobile number" required>
            </div>
            <div class="input-group">
                <label for="su-password">Password</label>
                <input type="password" id="su-password" placeholder="Min 6 characters" required>
            </div>
            <button type="submit">Create Account</button>
            <div class="switch-tab">Already have an account? <a data-goto="signin">Sign in</a></div>
        </form>
    </div>

    <script>
        /* ---------- Tab switching ---------- */
        function showTab(name) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
            document.querySelectorAll('.login-form').forEach(f => f.classList.toggle('active', f.dataset.form === name));
        }
        document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
        document.querySelectorAll('[data-goto]').forEach(a => a.addEventListener('click', () => showTab(a.dataset.goto)));

        /* ---------- Sign In ---------- */
        document.getElementById('signinForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const errEl = document.getElementById('signinError');
            errEl.style.display = 'none';
            const submitBtn = e.target.querySelector('button[type="submit"]');

            const email = document.getElementById('si-email').value.trim();
            const password = document.getElementById('si-password').value;

            setButtonLoading(submitBtn, true, 'Signing in…');
            const result = await loginUser(email, password);
            if (!result.ok) {
                setButtonLoading(submitBtn, false);
                errEl.textContent = result.error;
                errEl.style.display = 'block';
                return;
            }
            window.location.href = 'home.html';
        });

        /* ---------- Create Account ---------- */
        document.getElementById('signupForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const errEl = document.getElementById('signupError');
            errEl.style.display = 'none';
            const submitBtn = e.target.querySelector('button[type="submit"]');

            const name = document.getElementById('su-name').value.trim();
            const email = document.getElementById('su-email').value.trim();
            const phone = document.getElementById('su-phone').value.trim();
            const password = document.getElementById('su-password').value;

            if (!name || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                errEl.textContent = 'Please fill in a valid name and email.';
                errEl.style.display = 'block';
                return;
            }
            if (!/^\d{10}$/.test(phone)) {
                errEl.textContent = 'Please enter a valid 10-digit phone number.';
                errEl.style.display = 'block';
                return;
            }
            if (password.length < 6) {
                errEl.textContent = 'Password must be at least 6 characters.';
                errEl.style.display = 'block';
                return;
            }

            setButtonLoading(submitBtn, true, 'Creating account…');
            const result = await registerUser({ name, email, password, phone });
            if (!result.ok) {
                setButtonLoading(submitBtn, false);
                errEl.textContent = result.error;
                errEl.style.display = 'block';
                return;
            }
            window.location.href = 'account.html';
        });
    </script>
</body>
</html>
